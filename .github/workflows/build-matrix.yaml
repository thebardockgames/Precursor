name: Build

on:
  # Precursor disables the automatic push/pull_request
  # triggers here: this matrix builds Windows x2, Linux x2 and macOS x2 (macOS
  # runners bill at a 10x minutes multiplier on GitHub's free/private plan),
  # which drains a personal account's included Actions minutes in just a few
  # pushes during active development. Still available on demand via the
  # Actions tab ("Run workflow") whenever real cross-platform confidence is
  # wanted.
  workflow_dispatch: {}

jobs:
  # Windows
  build_windows_clang:
    name: "🖥️ Windows"
    uses: ./.github/workflows/windows-build-clang.yaml
    with:
      cmakePreset: "Release-windows-clang"
      cachePrefix: ""
    secrets: inherit

  build_windows_msvc:
    name: "🖥️ Windows"
    uses: ./.github/workflows/windows-build-msvc.yaml
    with:
      cmakePreset: "Release-windows-msvc"
      cachePrefix: ""
    secrets: inherit

  # Linux
  build_linux_clang:
    name: "🐧 Linux"
    uses: ./.github/workflows/linux-build-clang.yaml
    with:
      cmakePreset: "Release-linux-clang-asan"
      cachePrefix: ""
    secrets: inherit

  build_linux_gcc:
    name: "🐧 Linux"
    uses: ./.github/workflows/linux-build-gcc.yaml
    with:
      cmakePreset: "Release-linux-gcc"
      cachePrefix: ""
    secrets: inherit

  # MacOS
  build_macos_intel:
    name: "🍎 MacOS"
    uses: ./.github/workflows/macos-build.yaml
    with:
      cmakePreset: "Release-macos-x86_64-clang"
      cachePrefix: ""
    secrets: inherit

  build_macos_arm:
    name: "🍎 MacOS"
    uses: ./.github/workflows/macos-build-arm.yaml
    with:
      cmakePreset: "Release-macos-arm64-clang"
      cachePrefix: ""
    secrets: inherit
